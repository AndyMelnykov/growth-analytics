[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growth-analytics"
version = "0.1.0"
description = "AI product analytics graph: synthetic growth data, analytics and graph analysis"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
graph = ["igraph>=1.0,<1.1"]
funnels = ["duckdb>=1.1,<2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["graph*", "funnels*"]

[tool.setuptools.package-data]
funnels = ["sql/*.sql"]
graph = ["report/*.html"]

[tool.pytest.ini_options]
testpaths = ["graph/tests", "funnels/tests"]
addopts = "--junitxml=docs/test-reports/junit.xml"
